[packs]
enabled = [
  "database.postgresql",
  "database.redis",
  "containers.docker",
  "containers.compose",
  "kubernetes.kubectl",
  "cloud.aws",
  "cloud.gcp",
  "infrastructure.terraform",
  "platform.github",
  "secrets.onepassword",
  "system.disk",
  "system.permissions",
  "package_managers",
  "strict_git",
]

[heredoc]
enabled = true
timeout_ms = 50
fallback_on_parse_error = true
fallback_on_timeout = true

[output]
high_contrast = false

[theme]
palette = "default"
use_unicode = true
use_color = true
